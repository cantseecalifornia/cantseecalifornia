<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <link rel="stylesheet" href="counter.css">
</head>
<body>

  <div class="container">
    <div class="counter-display" id="counter">0</div>
    
    <div class="controls">
      <button class="btn btn-minus" id="btnMinus" aria-label="minus">-</button>
      <input type="number" class="number-input" id="amountInput" value="" min="1" placeholder="">
      <button class="btn btn-plus" id="btnPlus" aria-label="plus">+</button>
    </div>
  </div>

  <script src="counter.js"></script>
</body>
</html>
