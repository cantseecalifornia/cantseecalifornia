<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter</title>
    <link rel="stylesheet" href="counter.css">
</head>

<body>

    <div id="container">
        <div class="terminal-box">
            <div id="counter-display" class="counter-value">0</div>

            <div class="input-panel">
                <button class="action-btn" onclick="handleUpdate('minus')">[-]</button>
                <input type="number" id="custom-amount" placeholder="VALUE">
                <button class="action-btn" onclick="handleUpdate('plus')">[+]</button>
            </div>
        </div>
    </div>

    <script src="counter.js"></script>
</body>

</html>
