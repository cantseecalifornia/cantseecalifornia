<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="text_converter.css">
    <title>text converter</title>
    <script src="text_converter.js" defer></script>
</head>

<body>
    <div id="main-wrapper">
        <div id="container">
            <div class="field-group">
                <textarea id="input-text" placeholder="input text here"></textarea>
                <div class="char-count" id="input-count">chars: 0</div>
            </div>
            
            <div class="field-group">
                <textarea id="output-text" placeholder="click to copy" readonly></textarea>
                <div class="char-count" id="output-count">chars: 0</div>
            </div>
        </div>

        <div id="options">
            <label>
                <input type="checkbox" id="keep-lines">
                <span>keep line breaks</span>
            </label>
        </div>
    </div>
</body>

</html>
